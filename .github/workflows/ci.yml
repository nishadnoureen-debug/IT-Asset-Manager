name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itam
          POSTGRES_PASSWORD: itam
          POSTGRES_DB: itam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itam -d itam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://itam:itam@localhost:5432/itam_test?schema=public
      TEST_DATABASE_URL: postgresql://itam:itam@localhost:5432/itam_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run prisma:validate -w @itam/api
      - run: npm run typecheck
      - run: npm test
      - name: Database integration tests (migrations, constraints, seed)
        run: npm run test:db
      - run: npm run build

  # The images Render (and Docker Compose) run. Render deploys only after these checks pass.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t itam-api .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile --build-arg API_INTERNAL_URL=api-host -t itam-web .
      - name: API image drops root and can write to a root-owned storage mount (like a Render disk)
        run: |
          sudo install -d -o root -g root -m 755 /tmp/storage
          docker run --rm -v /tmp/storage:/data/storage itam-api \
            sh -c 'test "$(id -un)" = app && touch /data/storage/probe && echo "storage writable as $(id -un)"'
      - name: Web image serves the sign-in page
        run: |
          docker run -d --name web -p 3000:3000 itam-web
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then echo "web is up"; exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1
