name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itam
          POSTGRES_PASSWORD: itam
          POSTGRES_DB: itam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itam -d itam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://itam:itam@localhost:5432/itam_test?schema=public
      TEST_DATABASE_URL: postgresql://itam:itam@localhost:5432/itam_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run prisma:validate -w @itam/api
      - run: npm run typecheck
      - run: npm test
      - name: Database integration tests (migrations, constraints, seed)
        run: npm run test:db
      - run: npm run build

  # The images Render (and Docker Compose) run. Render deploys only after these checks pass.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t itam-api .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile --build-arg API_INTERNAL_URL=api-host -t itam-web .
      - name: API image drops root and can write to a root-owned storage mount (like a Render disk)
        run: |
          sudo install -d -o root -g root -m 755 /tmp/storage
          docker run --rm -v /tmp/storage:/data/storage itam-api \
            sh -c 'test "$(id -un)" = app && touch /data/storage/probe && echo "storage writable as $(id -un)"'
      - name: Web image serves the sign-in page
        run: |
          docker run -d --name web -p 3000:3000 itam-web
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then echo "web is up"; exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1

  # The single-container image used on Render's free plan (docker/app.Dockerfile).
  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single-container image
        run: docker build -f docker/app.Dockerfile -t itam-app .
      - name: Run it against PostgreSQL the way Render does
        run: |
          docker network create itam
          docker run -d --name db --network itam \
            -e POSTGRES_USER=itam -e POSTGRES_PASSWORD=itam -e POSTGRES_DB=itam postgres:16-alpine
          until docker exec db pg_isready -U itam -d itam >/dev/null 2>&1; do sleep 1; done
          docker run -d --name app --network itam -p 3000:10000 \
            -e PORT=10000 -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://itam:itam@db:5432/itam?schema=public \
            -e JWT_ACCESS_SECRET=ci-secret-that-is-long-enough-for-hs256-signing \
            -e ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e STORAGE_DRIVER=database -e BOOTSTRAP_ADMIN_EMAIL=owner@example.com \
            -e RENDER_EXTERNAL_URL=https://example.onrender.com \
            itam-app
      - name: Web, API and database answer through the public port
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://localhost:3000/api/v1/health/ready; then break; fi
            if [ "$i" = 120 ]; then docker logs app; exit 1; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3000/login
          curl -fsS http://localhost:3000/api/v1/auth/registration | grep -q '"enabled":true'
          echo "web, API and database are up"
      - name: API is private (loopback only)
        run: |
          docker exec app sh -c 'netstat -tln | grep ":4000 "'
          docker exec app sh -c 'netstat -tln | grep ":4000 " | grep -q "127.0.0.1:4000"'
      - name: Logs
        if: always()
        run: docker logs app 2>&1 | tail -60
