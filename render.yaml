# Render Blueprint — FREE setup: one free web service (web app + API in one container) and a free
# PostgreSQL database from Neon (neon.com). Setup steps: docs/deployment.md → "Render (free)".
#
#   arc-itam   https://arc-itam.onrender.com (a suffix is added if the name is taken)
#
# Free-plan behaviour: the service sleeps after 15 minutes without visits; the next visit wakes it in
# about a minute. Uploaded files are stored in the database (no disk on free plans). Daily alerts run
# each time the service wakes. To remove the sleep, change `plan` to 0.5c-512mb (US$7/month).
#
# Every push to main redeploys once the GitHub CI checks pass; migrations run before the app starts.

services:
  - type: web
    name: arc-itam
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/app.Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    envVars:
      # Asked for when the Blueprint is created:
      # the Neon connection string (postgresql://…neon.tech/neondb?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Your email: only this address can create the first (Super Admin) account.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      # Random secrets generated once by Render. Keep a copy of ENCRYPTION_KEY somewhere safe:
      # without it, stored licence keys cannot be decrypted.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      # Uploaded files live in PostgreSQL: free services have no persistent disk.
      - key: STORAGE_DRIVER
        value: database
      # The API sees requests from the web server (loopback) behind Render's proxy (private range).
      - key: TRUST_PROXY
        value: loopback, uniquelocal
      # PUBLIC_WEB_URL (used in QR labels) defaults to this service's Render URL. Set it only if you
      # add a custom domain.
