# Development environment.
#   Database only:  docker compose -f docker/docker-compose.yml up -d db
#   Full stack:     docker compose -f docker/docker-compose.yml up --build
name: itam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itam}
      POSTGRES_DB: ${POSTGRES_DB:-itam}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-itam} -d ${POSTGRES_DB:-itam}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-itam}:${POSTGRES_PASSWORD:-itam}@db:5432/${POSTGRES_DB:-itam}?schema=public
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - '4000:4000'

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  pgdata:
