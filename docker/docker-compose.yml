# Full stack in containers.
#   1. cp docker/.env.example docker/.env   and fill in the secrets
#   2. docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
#   3. docker compose -f docker/docker-compose.yml exec api node dist/database/create-admin.js --email you@company.com
#
# Database only (for local development): docker compose -f docker/docker-compose.yml up -d db
name: itam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itam}
      POSTGRES_DB: ${POSTGRES_DB:-itam}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-itam} -d ${POSTGRES_DB:-itam}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-itam}:${POSTGRES_PASSWORD:-itam}@db:5432/${POSTGRES_DB:-itam}?schema=public
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in docker/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in docker/.env}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - storage:/data/storage
    # Not published: the browser reaches the API through the web container's /api/v1 proxy.
    expose:
      - '4000'

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
  storage:
